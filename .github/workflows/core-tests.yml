name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test release notes validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run offline tests (no account or reset calls)
        run: swift test

  app-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Xcode toolchain
        run: xcodebuild -version
      - name: Build macOS application without signing
        run: |
          xcodebuild -project CodexWatcher.xcodeproj -scheme CodexWatcher \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CodexWatcherBuild" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check isolated English UI interactions
        run: python3 scripts/smoke-test-app.py "$RUNNER_TEMP/CodexWatcherBuild/Build/Products/Release/CodexWatcher.app" --language en
      - name: Check isolated Simplified Chinese UI interactions
        run: python3 scripts/smoke-test-app.py "$RUNNER_TEMP/CodexWatcherBuild/Build/Products/Release/CodexWatcher.app" --language zh-Hans
